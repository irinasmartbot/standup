name: Check VPS host

on:
  push:
    branches:
      - check/vps-host

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Open the deploy host and print its name
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/vps_key -o IdentitiesOnly=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" "hostname; hostname -I; systemctl is-active standup-bot || true; systemctl is-active standup-vk-bot || true; systemctl is-active standup-admin || true"
