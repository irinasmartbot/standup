name: Deploy VK bot to VPS

on:
  push:
    branches:
      - vk-mvp

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy VK over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" <<'EOF'
          set -euo pipefail
          cd /home/standup/vk-app
          git fetch origin vk-mvp
          git checkout vk-mvp
          # Код VK на сервере всегда = origin/vk-mvp (.env не в git).
          git reset --hard origin/vk-mvp
          git clean -fd -e .env -e venv -e '__pycache__' -e '*.pyc'
          /home/standup/vk-app/venv/bin/python -m pip install -r requirements.txt
          /home/standup/vk-app/venv/bin/python -c "import vk_bot"
          sudo /usr/bin/systemctl restart standup-vk-bot
          sleep 2
          sudo /usr/bin/systemctl is-active --quiet standup-vk-bot || (
            sudo /usr/bin/journalctl -u standup-vk-bot -n 80 --no-pager
            exit 1
          )
          EOF
