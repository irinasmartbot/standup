name: Telegram transport tests

on:
  pull_request:
    paths:
      - 'bot/utils/telegram_relay.py'
      - 'bot/utils/telegram_monitor.py'
      - 'scripts/telegram_transport_watch.py'
      - 'tests/test_telegram_*.py'
      - 'test_telegram_relay.py'
      - '.github/workflows/telegram-transport-tests.yml'
  push:
    branches: [codex/telegram-failover-alerts-20261126]
    paths:
      - '.github/workflows/telegram-transport-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'aiogram>=3.7,<4' 'aiohttp>=3.9,<4' python-dotenv pytest
      - run: python -m pytest test_telegram_relay.py tests/test_telegram_failover.py tests/test_telegram_monitor.py -q
