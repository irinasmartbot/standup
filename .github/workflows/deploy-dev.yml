name: Deploy dev to VPS

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" <<'EOF'
          set -euo pipefail
          cd /home/standup/app
          git fetch origin dev
          git checkout dev
          # Код на сервере всегда = origin/dev (.env не в git, не затрагивается).
          # Иначе локальные hotfix'ы на VPS блокируют pull.
          git reset --hard origin/dev
          git clean -fd -e .env -e venv -e '__pycache__' -e '*.pyc'
          /home/standup/app/venv/bin/python -m pip install -r requirements.txt
          /home/standup/app/venv/bin/python -c "from bot.db.crud import ensure_help_tables, ensure_raffle_tables, ensure_pdn_consent_columns; from bot.db.analytics import ensure_analytics_tables; ensure_raffle_tables(); ensure_help_tables(); ensure_analytics_tables(); ensure_pdn_consent_columns()"
          /home/standup/app/venv/bin/python -c "import main"
          /home/standup/app/venv/bin/python scripts/import_events_from_sheets.py --format proverka --source-sheet "Проверка материала"
          /home/standup/app/venv/bin/python scripts/import_events_from_sheets.py --format best --source-sheet "StandUp BEST"
          /home/standup/app/venv/bin/python scripts/import_events_from_sheets.py --format hitloto --source-sheet "Hit Lotto"
          sudo /usr/bin/systemctl restart standup-bot
          sleep 2
          sudo /usr/bin/systemctl is-active --quiet standup-bot || (
            sudo /usr/bin/journalctl -u standup-bot -n 80 --no-pager
            exit 1
          )
          if sudo /usr/bin/systemctl list-unit-files standup-admin.service --no-legend | grep -q standup-admin.service; then
            sudo /usr/bin/systemctl restart standup-admin
            sleep 1
            sudo /usr/bin/systemctl is-active --quiet standup-admin || (
              sudo /usr/bin/journalctl -u standup-admin -n 80 --no-pager
              exit 1
            )
          else
            echo "standup-admin.service not found; skipping restart"
          fi
          # VK-бот — отдельная копия (/home/standup/vk-app), тот же origin/dev.
          # Ошибки VK не валят весь деплой: TG/admin уже перезапущены выше.
          if [ -d /home/standup/vk-app/.git ]; then
            (
              set -euo pipefail
              cd /home/standup/vk-app
              git fetch origin dev
              git checkout dev
              git reset --hard origin/dev
              git clean -fd -e .env -e venv -e '__pycache__' -e '*.pyc' -e 'data/storage'
              /home/standup/vk-app/venv/bin/python -m pip install -r requirements.txt
              /home/standup/vk-app/venv/bin/python -c "import vk_bot"
              if sudo /usr/bin/systemctl list-unit-files standup-vk-bot.service --no-legend | grep -q standup-vk-bot.service; then
                sudo /usr/bin/systemctl restart standup-vk-bot
                sleep 2
                sudo /usr/bin/systemctl is-active --quiet standup-vk-bot
              else
                echo "standup-vk-bot.service not found; skipping restart"
              fi
            ) || {
              echo "WARNING: VK deploy failed; TG/admin already updated"
              sudo /usr/bin/journalctl -u standup-vk-bot -n 40 --no-pager || true
            }
          else
            echo "vk-app not found; skipping VK deploy"
          fi
          if sudo /usr/bin/systemctl list-unit-files standup-events-sync.service --no-legend | grep -q standup-events-sync.service; then
            sudo /usr/bin/systemctl disable --now standup-events-sync || echo "standup-events-sync stop/disable failed; continuing"
          else
            echo "standup-events-sync.service not found; skipping"
          fi
          EOF
